services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "true"
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api
    expose:
      - "8081"

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TELEGRAM_API_BASE: http://telegram-bot-api:8081
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api
      - bot-data:/data
    depends_on:
      - telegram-bot-api

  ftp:
    build: ./ftp
    restart: unless-stopped
    env_file: .env
    environment:
      FTP_ROOT: /data
      FTP_PASV_MIN_PORT: ${FTP_PASV_MIN_PORT:-21100}
      FTP_PASV_MAX_PORT: ${FTP_PASV_MAX_PORT:-21110}
    volumes:
      - bot-data:/data:ro
      - ftp-certs:/etc/vsftpd/ssl
    ports:
      - "21:21"
      - "${FTP_PASV_MIN_PORT:-21100}-${FTP_PASV_MAX_PORT:-21110}:${FTP_PASV_MIN_PORT:-21100}-${FTP_PASV_MAX_PORT:-21110}"
    depends_on:
      - bot

volumes:
  bot-api-data:
  bot-data:
  ftp-certs:
