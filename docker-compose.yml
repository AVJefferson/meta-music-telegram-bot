x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    # Needs Bot API 10.2+ for ephemeral receiver_user_id. Keep this image current.
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "true"
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api
    expose:
      - "8081"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Server starts as root and drops to its own uid, so it keeps the id-change caps.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    pids_limit: 512
    mem_limit: 1g
    logging: *logging

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TELEGRAM_API_BASE: http://telegram-bot-api:8081
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api
      - bot-data:/data
    depends_on:
      - telegram-bot-api
    # Entrypoint fixes volume ownership as root, then drops to APP_UID.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    pids_limit: 512
    mem_limit: 2g
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "test -d /data/library && test -d /data/review && test -d /data/covers && test -d /data/cache"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s

  website:
    build: ./website
    restart: unless-stopped
    # Public policies at www.music.avje.in. Host nginx → 127.0.0.1:8082.
    ports:
      - "127.0.0.1:8082:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 64m
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3

  ftp:
    profiles: ["ftp"]
    build: ./ftp
    restart: unless-stopped
    # Shared cache only. Never sqlite, OAuth tokens, or hifi.session.
    environment:
      FTP_ROOT: /data
      FTP_USER: ${FTP_USER}
      FTP_PASSWORD: ${FTP_PASSWORD}
      FTP_PASV_ADDRESS: ${FTP_PASV_ADDRESS}
      FTP_PASV_MIN_PORT: ${FTP_PASV_MIN_PORT:-21100}
      FTP_PASV_MAX_PORT: ${FTP_PASV_MAX_PORT:-21110}
    volumes:
      - type: volume
        source: bot-data
        target: /data/cache
        read_only: true
        volume:
          subpath: cache
      - ftp-certs:/etc/vsftpd/ssl
    ports:
      - "21:21"
      - "${FTP_PASV_MIN_PORT:-21100}-${FTP_PASV_MAX_PORT:-21110}:${FTP_PASV_MIN_PORT:-21100}-${FTP_PASV_MAX_PORT:-21110}"
    depends_on:
      bot:
        condition: service_healthy
    # No no-new-privileges here: PAM may fall back to the setuid unix_chkpwd helper.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
      - SYS_CHROOT
    pids_limit: 256
    mem_limit: 512m
    logging: *logging

volumes:
  bot-api-data:
  bot-data:
  ftp-certs:
