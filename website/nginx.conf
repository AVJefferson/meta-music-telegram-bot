server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # html / css / js (+ tiny extras). Nothing else.
    types {
        text/html              html;
        text/css               css;
        application/javascript js;
        image/svg+xml          svg;
        image/png              png;
        image/jpeg             jpg jpeg;
        image/x-icon           ico;
        text/plain             txt;
        text/xml               xml;
    }
    default_type application/octet-stream;

    gzip on;
    gzip_types text/html text/css application/javascript text/plain text/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;

    location / {
        limit_except GET HEAD {
            deny all;
        }
        try_files $uri $uri.html $uri/ =404;
    }
}
